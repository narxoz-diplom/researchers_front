server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    # Behind the edge proxy: never leak the internal :8081 port in redirects.
    absolute_redirect off;

    # Vite emits ES-module workers (pdf.js) as .mjs; nginx's default map only
    # knows .js, and a module worker served as octet-stream is refused by the
    # browser. A `types` block replaces the inherited map, so re-include it.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed Vite assets — long-term cache.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static data-analysis landing (public/data-analysis) — served without a trailing slash too.
    location = /data-analysis {
        rewrite ^ /data-analysis/index.html last;
    }

    # SPA fallback: every unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
